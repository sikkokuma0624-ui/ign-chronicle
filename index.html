lore:'爪先に残り火を纏わせて斬り裂く、黒焔使いの基本形。傷口に火種が残り、消えずに燻り続ける。|熱した一点だけを突き込み、神経ごと灼いて動きを止める短打。|自分の身体を薪として扱う体術。当てるたびに己を削り、代わりに焔を一枚積む。|皮膚の表面を薄い灰の層で覆う。灰は熱も刃も一度は受け止め、崩れながら守る。|胸の奥の残り火を意図的に焚きつける。呼吸が浅くなる代わりに、腕の振りが重くなる。|燃え残りの灰を敵の口と目に流し込み、踏み込みの精度を奪う呪い。|掌で押し込むように焔を注ぎ込む。当たった面から内側へ向かって燃え広がる。|左右の焔を交差させて二度斬る。一撃は浅いが、傷が二本重なるほど火の回りは早い。|燃え方の中心――芯の位置を視る眼。芯を叩けば、同じ一撃でも崩れ方が変わる。|踏み込みのたびに火花を散らし、その反動で軌道をずらす歩法。|燃焼速度そのものを引き上げ、思考と手数を火の速さに合わせる。|不完全燃焼をわざと起こし、濃い黒煙で敵の視界と呼吸を潰す。|積み上げた焔を一斉に点火する。溜めた枚数がそのまま爆圧になる、黒焔の主砲。|消えかけの火を自分の傷口に押し当てて塞ぐ。治すというより、焼いて閉じる。|燃やした生命の熱を、そのまま自分の芯へ引き戻す循環。|受け流した勢いに火を乗せて返す構え。避けた分だけ、熱が相手へ戻る。|自分の周囲に薄い火の壁を立て、届く前に威力を焼き削る。|敵の装甲表面を灰に変えて溶かし落とす。硬いものほど脆く崩れる。|足元一帯を火の原に変える広域技。逃げ場が焼けるので、敵は立ち尽くすしかない。|自分の影を焼いて実体化させ、本体と同時に二方向から灼く。|心臓を炉に作り替える。一度点いた火が、以前より深く長く燃えるようになる。|追い詰められるほど燠が赤くなる性質。倒れる寸前が、いちばん熱い。|燃焼を安全域の外まで回す。短時間だけ出力が跳ね上がり、あとで必ず反動が来る。|敵の身体を炭化させる遅い呪い。動きも守りも、炭のように脆くなる。|敵を黒い炉で包み、外から蓋をして焼き切る奥義。焔を積んだ数だけ炉の温度が上がる。|一度灰になって間合いを渡る歩法。実体のない一瞬に振るう刃は、防具に触れず中身だけを断つ。|身体を焔の器として完成させた状態。火は宿主を選ばなくなり、ただ器の形に燃える。|自分の火では焼けない身体。守りに徹している間、焦げた組織が焼き直されて再生する。|自らを燃料として焚べる最終形態。命を削るほど、扱える焔の総量が増える。|敵に消えない焼き印を刻む。刻まれた者は、あらゆる攻撃に対して余分に燃える。',
fx:'{player}の指先で、消えかけた火が牙の形に固まる。|{player}は白熱した一点を作り、そこへ全体重を乗せた。|||{player}は肺の底の火を掻き起こした。呼吸が熱を帯びる。|灰が舞い上がり、{enemy}の呼吸へ入り込んでいく。|{player}の掌の中で、火が渦を巻いて圧を上げていく。|{player}の両腕に、対になった火の牙が生まれる。|||燃える速度が上がり、{player}の視界だけが少し先へ進む。|わざと燻らせた黒煙が、{terrain}を低く這って広がった。|{player}が指を鳴らす。積み上がった焔が、内側から一斉に点火された。|{player}は残り火を掌に集め、自分の傷へ押し当てた。|||{player}の周囲に、陽炎じみた薄い壁が立ち上がる。|{enemy}の表皮が灰色に変わり、ぼろりと崩れ始めた。|{player}が地を踏み抜くと、火が原になって走り出した。|{player}の影が焼け立ち上がり、二つの影が同時に踏み込む。|||制御を捨てた燃焼が、{player}の体温を危険域まで押し上げる。|{enemy}の身体が黒く炭化し始め、動きが軋み出した。|黒い火が四方から立ち上がり、{enemy}を収める棺の形になる。|{player}の輪郭が灰になって崩れ、次の瞬間には{enemy}の内側にいた。|||{player}は自分自身を薪として焚べた。視界が白く灼ける。|{enemy}の身体に、赤熱した刻印が焼き付いた。',
hx:'爪が肉を裂き、その奥に火種を置き去りにした。|灼けた切先が神経を焼き切り、{enemy}の動きが痙攣で止まる。|||||掌が触れた瞬間、内側から燃え広がる音がした。|交差する二本の火線が、{enemy}の輪郭を裂いた。|||||溜め込まれた火が同時に膨張し、{enemy}を内側から吹き飛ばす。||||||逃げ場のすべてが燃え、{enemy}は炎の中心で立ち尽くす。|影と本体、二方向からの熱が{enemy}を挟み込んだ。|||||棺の蓋が閉じ、内側の温度だけが際限なく上がっていく。|防具の内側だけが、確かに斬られていた。||||',

gravity:{lore:"局所的に重力を跳ね上げた一撃。相手の体重ごと、地面へ叩き落とす。|重さを一点に集めて突く。沈み込んだ身体は、次の動作へ移れない。|当てた箇所へ重さを置いていく体質。積もった重圧が、敵の回避を殺す。|密度を極限まで上げた皮膚。刃は入る前に、重さに負けて逸れる。|自分にかかる圧を意図的に上げる。踏み込みの重さが、そのまま威力になる。|敵の身体だけ重力を強くする。腕が上がらなければ、攻撃は形にならない。|掌に集めた重力場を押し当てる。触れた面から、内側へ沈んでいく。|二つの重力軌道を同時に描く。片方を避けても、もう片方が引き寄せる。|重力の歪みが視える眼。物が落ちる先には、必ず理由がある。|重力を蹴って低く滑る歩法。落ちる勢いを、そのまま横移動へ変える。|自分の質量を加速に変える。重いものほど、止まらなくなる。|一帯の重力場を歪める。踏み込むたび、足が沈んで前に出られない。|積み上げた重圧を一気に解放する。溜まった分だけ、真上から落ちてくる。|自分にかかる重力を打ち消す。浮いている間、傷の負担が消えていく。|敵の質量そのものを吸い上げる。奪った重さが、こちらの生命になる。|受けた力を重力で下へ折り返す構え。攻めてきた腕が、自分の重さで潰れる。|地平線と同じ高さの重力壁を立てる。越えようとした物は、全て落ちる。|敵の周囲の軌道を腐らせる。守りの動作が、正しい位置へ届かなくなる。|流星を模した落下攻撃。落ちる高さの分だけ、着弾の破壊力が増す。|同じ質量を二度落とす。一度目で沈み、二度目で潰れる。|高密度化した身体。一度かけた重圧が、以前より長く残るようになる。|地面に近いほど力が出る性質。倒れかけた身体が、最も重い一撃を出す。|自分の質量を限界まで引き上げる。動きは鈍るが、当たれば終わる。|敵にかかる重さを増し続ける呪い。攻めも守りも、自分の重さに負けていく。|一点へ全ての重さを集める最終奥義。溜めた重圧の分だけ、特異点は深くなる。|質量をゼロにした刃。重さのないものは、防具に受け止められない。|重さを容れる器として完成した状態。積み上げられる重圧の総量が増える。|落下し続けても壊れない軌道。守勢の間、重さが身体を元の形へ押し戻す。|重力そのものが{player}に従う状態。落ちる方向を、自分で決められる。|敵に特異点の印を刻む。刻まれた者は、あらゆる攻撃を余分に受ける。",
fx:"{player}の拳の先で、重力が跳ね上がった。|重さが一点に集まり、{enemy}の身体が沈み込む。|||{player}にかかる圧が上がる。踏み込みが、重い。|{enemy}の身体だけが重くなり、腕が上がらなくなる。|{player}の掌に集まった重力場が、押し当てられる。|二つの重力軌道が、同時に{enemy}を捉えた。|||{player}の質量が、そのまま加速へ変わっていく。|一帯の重力場が歪み、{enemy}の足が沈む。|積み上げられた重圧が、一気に解放された。|{player}にかかる重力が消え、身体が軽くなっていく。|||地平と同じ高さの重力壁が、静かに立ち上がる。|{enemy}の守りの軌道が、正しい位置から逸れていく。|{player}が跳ね上がり、流星の軌道で落ちてくる。|同じ質量が、二度続けて落ちてきた。|||{player}の質量が限界まで引き上げられる。動きは鈍い。|{enemy}にかかる重さが、際限なく増していく。|一点へ全ての重さが集まり始めた。|質量をゼロにした刃が、抵抗なく滑り込む。|||重力が{player}に従った。落ちる方向は、こちらが決める。|{enemy}に、特異点の印が刻まれた。",
hx:"体重ごと、{enemy}が地面へ叩き落とされた。|沈み込んだ{enemy}は、次の動作へ移れない。|||||触れた面から、{enemy}が内側へ沈んでいく。|片方を避けても、もう片方が引き寄せていた。|||||溜まった重さが、そのまま真上から落ちてくる。||||||落ちた高さの分だけ、{enemy}が潰れた。|一度目で沈み、二度目で潰れる。|||||全ての重さが一点へ集まり、{enemy}が形を保てない。|重さのないものは、防具に受け止められなかった。||||",

dream:{lore:"相手が眠っている間に見るはずだった夢を、刃に変えて振るう。|眠気そのものを突き込む。意識が一瞬落ちた身体は、命令を受け取れない。|触れた相手の悪夢を採取する体質。当てるたびに、他人の恐怖が手に入る。|夢の膜で覆われた皮膚。届いた衝撃は現実味を失い、痛みだけが遠のく。|意識を深い眠りの層まで沈める。夢の中では、身体の制限が緩む。|敵の耳元で悪夢を囁く。見たくないものを見せられた者は、前に出られない。|掌から悪夢を流し込む。恐怖は内側で増え、勝手に膨らんでいく。|夢の中の自分と現実の自分が、同時に斬りかかる。どちらも本物だ。|夢と現実の境目が視える眼。境界の薄い場所を突けば、簡単に沈む。|夢の論理で移動する歩法。距離も向きも、夢の中では意味を持たない。|浅い眠りの層で思考を加速させる。夢の中の時間は、外より長い。|眠りの霧を撒く。吸い込んだ者は、自分が起きているのかも分からなくなる。|集めた悪夢を全て喰らう。喰った恐怖の量だけ力になり、同じだけ自分が満ちる。|白昼夢を見せて、傷ついた事実そのものを夢だったことにする。|敵の生命を夢の材料として吸い上げる。悪夢が濃いほど、こちらは元気になる。|避けた瞬間、相手を一瞬だけ夢へ落とす構え。目覚めた時には、もう殴られている。|眠りの繭を編んで身を包む。繭の中では、あらゆる干渉が遠い出来事になる。|敵の防御を夢の中の出来事にする。夢の装甲は、目覚めれば消える。|夢の底へ引きずり落とす咆哮。落ちた者は、しばらく浮き上がって来られない。|明晰夢の中で作った分身。夢の側の存在なので、傷つけようがない。|眠りを深くする心。一度与えた悪夢が、以前より長く続くようになる。|目覚める直前の夢がいちばん鮮明になる。追い詰められた身体ほど冴える。|夢と現実の切り替え速度を上げる。どちらにいるか誰にも掴ませない。|敵を金縛りに落とす呪い。意識はあるのに、身体だけが眠り続ける。|相手を永い眠りへ沈める最終奥義。集めた悪夢が多いほど、目覚めは遠くなる。|夢から覚める瞬間に振るう刃。覚醒の一瞬には、防具はまだ存在していない。|夢を容れる器として完成した状態。抱えられる悪夢の総量が増える。|眠り続ける限り死なない身体。守勢の間、夢が傷をなかったことにする。|夢の側の王になった状態。眠っているものは全て、{player}の管轄下にある。|敵に永眠の刻印を刻む。刻まれた者は、あらゆる攻撃を余分に受ける。",
fx:"{player}の手の中で、見るはずだった夢が刃の形を取る。|眠気そのものが、{enemy}の意識へ突き込まれる。|||{player}の意識が、深い眠りの層まで沈んでいく。|{player}が{enemy}の耳元で、見たくないものを囁いた。|{player}の掌から悪夢が流れ込み、内側で勝手に膨らんでいく。|夢の中の{player}と、現実の{player}が同時に踏み込む。|||浅い眠りの層で、{player}の思考だけが加速する。|眠りの霧が撒かれ、{enemy}は自分が起きているのかも分からない。|{player}が集めた悪夢を、まとめて喰らい始めた。|白昼夢が広がる。傷ついた事実そのものが、夢になっていく。|||眠りの繭が編まれ、{player}を柔らかく包んだ。|{enemy}の装甲が、夢の中の出来事へ変わっていく。|{player}の咆哮が、{enemy}を夢の底へ引きずり落とす。|明晰夢の中で作られた分身が、静かに並び立つ。|||夢と現実の切り替えが速すぎて、どちらにいるか掴めない。|{enemy}の意識だけを残して、身体が眠りに落ちていく。|{player}が{enemy}を、永い眠りへ沈め始めた。|覚醒の一瞬。まだ防具の存在しない時間に、刃が入る。|||眠るものは全て{player}の管轄になった。ここは夢の側だ。|{enemy}に、永眠の刻印が刻まれた。",
hx:"見るはずだった夢が、そのまま{enemy}を裂いた。|意識が一瞬落ち、{enemy}は命令を受け取れない。|||||流し込まれた恐怖が、{enemy}の内側で膨らんでいく。|夢と現実、どちらの刃も本物だった。|||||喰われた悪夢の分だけ、{player}が満ちていく。||||||夢の底へ落ちた{enemy}は、しばらく浮き上がれない。|夢の側の分身は、傷つけようがなかった。|||||{enemy}の目覚めは、もう来ない。|覚醒の一瞬に、防具はまだ存在していなかった。||||",

grimoire:{lore:"禁書の最初の頁を開き、燃える文字をそのまま咆哮として吐き出す。|千本の栞を針にして打ち込む縛術。挟まれた者は、頁のように動きを止める。|読んだ内容を書庫として蓄える体質。戦いながら、使える頁が増えていく。|革装の書物を身体に巻いた守り。頁は破れても、中身は無事に残る。|一頁を一瞬で読み切る技術。詠唱を飛ばし、術式の起動だけを抜き出す。|敵の頁を破り取る呪い。何かを失った者は、本来の力を出せない。|第二章に記された、百の口を持つ獣の列を呼ぶ。全ての口が同時に噛みつく。|無作為に頁を引いて術を起こす。追撃か、拘束か、回復か。読むまで分からない。|目次だけで内容を把握する眼。どこに何が書いてあるか、一目で分かる。|息を殺したまま読み続ける技術。集中している間、こちらの位置は掴まれない。|呪文の詠唱部分を省略する。効果はそのままに、発動だけが極端に速くなる。|湿った頁の霧を撒く。文字が滲むように、敵の視界と判断も滲んでいく。|第五章、蝕む頁の葬列。消費した頁の数だけ、行列は長く重くなる。|白紙の頁に自分の無事を書き込む。書かれたことは、書かれた通りになる。|書物が読者を喰う逆転現象。読み込んだ相手の生命が、こちらへ流れ込む。|避けた瞬間に一節を読み上げる。反撃と同時に、頁がもう一枚増える。|書物を閉じて砦とする。閉じられた本の中身には、誰も触れられない。|敵の存在に注釈を書き加える。註釈だらけの本文は、読む価値を失っていく。|第九章に記された無名の獣の来歴。読み上げるだけで、獣が来歴通りに暴れる。|術式を分冊し、二本の栞で同時に起動する。二冊分が同時に効く。|書庫そのものを心臓として動かす。一度点いた禁呪が、以前より長く燃える。|禁じられた章ほど手放せない。追い詰められた場面で、最も深い頁が開く。|速読を深い章にまで適用する。読む速さがそのまま手数になる。|裏表紙に敵の名を記す呪い。閉じられた本の外側に、居場所はない。|書庫そのものを崩落させる最終奥義。積み上げた頁が、全て凶器になって降る。|書物に記された真の名を解放する。真名の前では、防具の記述は無効になる。|身体が生きた書物になった状態。書き込める頁の総量が増える。|挟まれた栞が読者を守る。守勢の間、頁が身体を書き直していく。|禁書そのものが意思を持ち、{player}と共に戦い始める。|敵の名を真名として刻印する。名を知られた者は、全ての攻撃を余分に受ける。",

fate:{lore:"敵の命式に直接手を入れる一撃。数値をひとつ書き換えるだけで、身体は簡単に壊れる。|定められた寿命の線を突く。線が揺れた者は、一瞬だけ自分の存在が曖昧になる。|当てた相手の命式を読み取って控える体質。触れるほど、書き換えの材料が増える。|祈りを織り込んだ皮膚。不運な当たり方だけが、綺麗に逸れていく。|自分の運気の項目を上へ書き直す。根拠はないが、なぜか上手くいく。|敵の命式に凶の字を書き足す。踏み込む理由が、少しずつ削られていく。|掌で触れて、敵の攻撃力の一部を自分の欄へ移し替える。奪った分だけ、差が開く。|二つの命式を並行して走らせる。同じ身体が、二度行動したことになる。|他人の命式が視える眼。どこを直せば崩れるかが、数値として読める。|災いの項目だけを避けて歩く歩法。当たるはずのものが、なぜか当たらない。|自分の命式に加護の欄を追加する。決まるべき場面が、確実に決まるようになる。|敵の命式を縄で縛る。動きの選択肢そのものが、書き換えで潰れていく。|自分の寿命を燃料に燃やす禁術。奪った敵の数値が、そのまま自分の欄へ移る。|幸運の項目を最大値で書き直す。運が良ければ、傷はなかったことになる。|敵の命式から生命の数値を削り、自分の欄へ加算する。|災いを書き換えて送り返す構え。避けた不運は、書いた本人へ戻る。|天の記述を盾に変える。定められた守りは、理屈を超えて硬い。|敵の命式を腐らせる。防御の項目から順に、読めない文字へ変わっていく。|天変の記述を呼び出す咆哮。書かれた災厄が、そのまま現象として落ちてくる。|平行世界の自分の命式を重ねる。二人分の記述が、一つの身体で同時に動く。|命式を扱う精度が上がった状態。同じ書き換えでも、効きが深くなる。|窮地に置かれた者の命式は、書き換えの余白が広い。追い詰められるほど強い。|限界の欄そのものを消して祈る。制限のない身体は、短時間だけ理不尽に強い。|敵の命式に死運を書き込む。攻めても守っても、悪い方の目が出続ける。|敵の命式を白紙に戻す最終奥義。書き換えた数だけ、消える項目が増える。|真の名前で命式を呼び直す刃。真名で呼ばれた者に、防具は登録されていない。|命式を容れる器として完成した状態。書き換えられる項目の数が増える。|死亡の欄が空白のまま埋まらない身体。守勢の間、傷の記述が消えていく。|命式の管理者権限を得た状態。他人の命式も、自分のものとして扱える。|敵の命式に死の一字を刻む。刻まれた者は、あらゆる攻撃を余分に受ける。",

nullfield:{lore:"触れた箇所の運動を止める打撃。熱も音も奪われ、そこだけが静止する。|敵の神経伝達を一瞬だけ零度へ落とす突き。命令が身体に届かなくなる。|触れたものを凍らせる体質。当てるたびに、冷気が相手の内側へ残っていく。|表面温度を極限まで下げた皮膚。衝撃は届く前に硬さを失い、砕ける。|感情も呼吸も限りなく静める。雑音が消えた分だけ、一撃が正確になる。|戦場そのものの温度を奪う。冷えた身体では、力任せの踏み込みが出せない。|掌から流し込む冷気で、内側から凍らせる。関節から順に、動かなくなる。|二本の刃で、動きと熱を別々に断つ。片方だけ避けても意味がない。|動きの止まる一点を見抜く眼。あらゆる動作には、必ず静止の瞬間がある。|足元を凍らせて滑る歩法。滑った分だけ、次に消すための力が溜まる。|思考の温度を落として研ぎ澄ます。迷いが凍りついて、砕けて消える。|氷点下の霧を張る。視界と音が同時に奪われ、敵は勘だけで動く羽目になる。|敵の次の行動そのものを、起こる前に無かったことにする。防ぐのではなく、消す。|凍らせて保存しておいた無傷な自分を、解凍して現在へ上書きする。|奪った熱を自分の生命に変換する。相手が冷えるほど、こちらは動ける。|触れた瞬間に凍らせて返す構え。攻めた側の腕が、先に止まる。|厚い氷の層で全方位を覆う。砕けながら、衝撃の芯だけを確実に殺す。|敵の装甲を凍らせて脆くする。硬いものほど、冷えれば割れる。|戦場全体を零度へ落とす咆哮。音すら凍りつき、動くものが消える。|氷で作った自分の像を並べ、本体と同時に斬りかかる。|心臓まで凍らせた状態。一度与えた冷気が、以前より深く残るようになる。|凍りついても意志だけは融けない。追い詰められた身体ほど、正確に動く。|無効の領域を最大まで押し広げる。この中では、こちらの理屈だけが通る。|敵の感覚を凍らせる。攻めも守りも、自分の手足の位置が分からなくなる。|領域内の事象そのものを消す最終奥義。凍らせた分だけ、消える範囲が広がる。|絶対零度の刃。防具は触れた時点で凍って砕けるため、遮るものが存在しない。|無を容れる器として完成した状態。消せる事象の総量そのものが増える。|自分の周囲だけ時間を止めた身体。守勢の間、傷は進行しない。|視界の全てが零度になる。溜められる無効の量に、上限が近づかなくなる。|敵の存在に削除線を引く。線を引かれた者は、あらゆる干渉を余分に受ける。",
fx:"{player}が触れた空間から、音と熱が抜け落ちた。|{enemy}の神経へ、伝達を止める冷気が差し込まれる。|||{player}の呼吸が止まる。雑音が、全て消えた。|{terrain}の温度が落ち、{enemy}の踏み込みから力が抜けていく。|{player}の掌から冷気が流れ込み、{enemy}が内側から凍り始める。|二本の刃が、動きと熱を別々に断ちに来る。|||思考の温度が落ちる。迷いが凍りついて消えた。|氷点下の霧が広がり、{terrain}から音が消えた。|{player}が手を下ろす。{enemy}の次の行動が、起こる前に消された。|凍らせて保存されていた無傷の身体が、解凍されていく。|||厚い氷の層が、{player}を全方位から覆った。|{enemy}の装甲が凍りつき、内側から罅が走る。|{player}の咆哮で戦場が零度へ落ちる。音すら凍りついた。|氷の像が並び立ち、本体と同時に踏み込む。|||無効の領域が押し広げられる。ここから先は{player}の理屈だ。|{enemy}の感覚が凍り、自分の手足の位置を見失っていく。|領域内の事象そのものが、端から消えていく。|絶対零度の刃。遮るものは、触れた時点で砕ける。|||視界の全てが零度になった。もう、溜められない量はない。|{enemy}の存在に、削除線が引かれた。",

reverse:{lore:"殴られる未来を先に再生し、その勢いで殴り返す打撃。順序が逆転している。|受けた衝撃を敵へ還す突き。返された側は、自分の力の重さに驚く。|痛みを棘として体内に蓄える体質。殴られるほど、返すための牙が増えていく。|衝撃の向きを反転させる皮膚。押し込まれた力が、押し返す力に変わる。|不利な流れを掴んで裏返す。押されていたはずの場面が、そのまま攻勢になる。|敵の攻撃という原因に、痛みという結果を先に貼り付ける。振るう前から萎える。|掌で受け、掌で返す。受け取った力に自分の分を足して、押し戻す。|一度受けた衝撃を、二度に分けて返す。返される側に、受け身は取れない。|流れが変わる一瞬を見抜く眼。逆転が起きる点は、必ず一つだけ存在する。|押された力を歩幅に変換する歩法。避けるたび、返すための棘が増える。|下降していた勢いを、そのまま上昇へ読み替える。窮地であるほど鋭くなる。|因果の輪の回転を遅らせる。敵の行動と結果の間に、無意味な間が生まれる。|溜め込んだ痛みを全て解き放ち、同量を自分の回復に変える。溜めた分だけ救われる。|傷を負う前の状態へ因果を巻き戻す祈り。過程は消え、結果だけが戻る。|与えた痛みの一部を、自分の生命として吸い上げる。|あらゆる接触を返礼として扱う構え。避けたことにも、返礼は発生する。|攻撃の因果を鏡写しにする。向かってきた力が、そのまま守りの厚みになる。|因果の輪そのものを腐らせる。守るという結果に、原因が繋がらなくなる。|これまで受けた全てを、正当な報いとして返す咆哮。理不尽ではなく、応報だ。|受けた衝撃の残響が形を持ち、本体と共に殴りかかる。|返す力そのものを増幅する心。蓄えた棘が、以前より深く刺さるようになる。|絶体絶命の場面でだけ働く反射。追い詰められた身体が、最も速い。|自分の限界という概念を裏返す。上限が下限になり、出力が跳ね上がる。|敵の因果から、良い結果だけを抜き取る。何をしても、噛み合わなくなる。|積み上げた全ての痛みを一巡させ、敵へ返し、同量を自分へ戻す最終奥義。|原因と結果を繋ぐ線そのものを断つ刃。防具が守るという因果も、まとめて断たれる。|逆流を容れる器として完成した状態。蓄えられる棘の総量が増える。|死という結果に、原因が繋がらない身体。守勢の間、因果が傷を認めない。|因果の順序を自分で決める権利を得た状態。受ける前に、返せる。|敵を報いの輪へ縛る刻印。以後、全ての攻撃が正当な報いとして深く入る。",
fx:"殴られる未来を先に再生し、{player}はその勢いで踏み込んだ。|受けた衝撃が、そのまま{enemy}へ還っていく。|||押されていた流れを、{player}が掴んで裏返した。|{enemy}の攻撃に、振るう前から結果が貼り付いた。|{player}は掌で受け、自分の分を足して押し戻す。|一度受けた衝撃が、二度に分けて返されていく。|||下降していた勢いが、そのまま上昇へ読み替えられる。|因果の輪の回転が遅れ、{enemy}の動作と結果の間に間が空く。|{player}が溜め込んだ痛みを、一斉に解き放った。|傷を負う前まで、因果が巻き戻されていく。|||向かってきた力が鏡写しになり、守りの厚みへ変わる。|{enemy}の守るという結果が、原因から切り離される。|{player}がこれまで受けた全てを、報いとして返し始めた。|受けた衝撃の残響が形を持ち、本体と並んで踏み込む。|||限界という概念が裏返る。上限は、もう下限だ。|{enemy}の因果から、良い結果だけが抜き取られていく。|積み上げた全ての痛みが、一巡を始めた。|原因と結果を繋ぐ線が、まとめて断たれる。|||因果の順序が{player}の手に渡った。受ける前に、返せる。|{enemy}が、報いの輪へ縛りつけられた。",

shadow:{lore:"敵の影を殴る打撃。影に与えた傷は、時間差で本体へ現れる。|影と地面を縫い留める針。縫われた側は、一歩も動けなくなる。|触れた影から糸を採る体質。攻撃が当たるたび、手元の糸が増えていく。|実体を影の濃度へ置き換えた皮膚。刃は通るが、傷は影にしか残らない。|意識を影の側へ沈める。存在感が薄れ、その分だけ動きが読まれなくなる。|敵の影に軽く結び目を作る。足が本来より重くなり、踏み込みが浅くなる。|掌から影糸を放って絡める。糸が増えるほど、敵の逃げ道が減っていく。|二本の針で影を同時に留める。片方を外しても、もう片方が残る。|暗がりでこそ働く眼。影の濃い場所には、必ず縫い代が見える。|自分の影の中へ踏み込む歩法。影から影へ、距離を無視して移動する。|呼吸も鼓動も影に沈める。次の一手まで、こちらの気配は存在しない。|影を霧状に散らす。敵は、自分の影がどこにあるのか分からなくなる。|糸を使い切って影の檻を編む。中に囚われた者は、動くほど締まる。|裂けた自分の影を縫い直す。影が戻れば、身体も戻る。|敵の影を少しずつ喰う。奪った影の厚みが、そのまま自分の生命になる。|避けた瞬間に糸を引く構え。回避が、そのまま拘束へ変わる。|影糸を密に織って鎧にする。柔らかいのに、断てない。|敵の装甲の縫い目だけを腐らせる。繋ぎ目を失った守りは、ただ剥がれる。|集めた影糸を獣の形に編み上げる。獣は影の速さで走り、噛みつく。|縦横に交差させて縫い留める。二度縫われた影は、もう本体を追えない。|影の濃度そのものを上げる心。同じ糸でも、深く食い込むようになる。|追い詰められた者だけが出せる速さ。逃げ場がない時、影は最も鋭い。|影の側の時間を早める。実体が追いつく前に、影が仕事を終える。|敵の関節に糸を通し、動きを外から操る。攻めも守りも、他人の手つきになる。|全ての糸で影の棺を編み上げる最終奥義。縫い込まれた者は、二度と光へ戻れない。|影ごと断つ刃。実体を挟まないため、鎧の内側だけが正確に切れる。|影そのものを容れる器となった状態。扱える糸の総量が増える。|光を当てても薄くならない影。守勢に入るたび、影が身体を編み直す。|全身が織機になった状態。呼吸するだけで、糸が生まれ続ける。|敵の影に切れない印を縫い込む。以後、全ての攻撃が深く食い込む。",
fx:"{player}は{enemy}本体ではなく、その影を殴りにいった。|{player}の指から伸びた針が、影と地面を縫いに走る。|||{player}の意識が影の側へ沈み、気配が薄くなる。|{enemy}の影に、小さな結び目が作られた。|{player}の掌から影糸が放たれ、{enemy}へ絡みつく。|二本の針が、同時に影へ落ちる。|||{player}の呼吸も鼓動も、影の中へ沈んだ。|影が霧状に散り、{terrain}から輪郭が消えていく。|{player}が糸を引き絞る。影が檻の形に編み上がった。|裂けた影が、細かく縫い直されていく。|||影糸が密に織られ、{player}を柔らかく覆った。|{enemy}の装甲の縫い目だけが、腐って解けていく。|集めた糸が獣の形に編み上がり、影の速さで走り出す。|縦横に交差した糸が、{enemy}の影を挟み込む。|||影の側の時間が早まる。実体が追いつく前に、終わる。|{enemy}の関節に糸が通された。動きが、他人のものになる。|全ての糸が集まり、{enemy}を収める棺を編み始めた。|影ごと断つ刃が、実体を挟まずに滑り込む。|||{player}の全身が織機になった。呼吸のたびに糸が増える。|{enemy}の影に、切れない印が縫い込まれた。",

function fusionRider(t,sl){

function buildSkillTiers(key){

var d=abilityData(key),names=d.names.split('|'),T=[];
var lore=(d.lore||'').split('|'),fxs=(d.fx||'').split('|'),hxs=(d.hx||'').split('|');

var ov=(d.ov&&d.ov[t+'-'+s])||{};for(var k2 in ov)m[k2]=ov[k2];
var cat=m.cat||(s<2?'active':s<4?'passive':s===4?'buff':'debuff');delete m.cat;

if(key==='integrated'){

else{var rd=fusionRider(t,s);

lr=lr+'（融合：'+rd.txt+'）';}}}
var sk={id:key+'_'+t+'_'+s,cat:cat,name:nm,tags:tagsOf(m,cat),lore:lr,fx:fxv,hx:hxv};
for(var k3 in m)sk[k3]=m[k3];
sk.desc=describe(sk,d);row.push(sk);}
T.push(row);}
tierCache[key]=T;return T;}

mv:["調律機が数値を書き換え、こちらの動きを一段遅くしてきた！", "機構の腕部が正確な角度で振り下ろされる！", "調律機が周囲の物理法則をずらし、間合いを詰めてくる！"],
low:"調律機の回転が乱れ、初めて規定外の音を立てた。誤差を、修正しきれていない。",
dead:"調律機は回転を止め、調整されていた世界の数値が、少しだけ狂ったまま残された。",
sp:[{n:"再調律",m:1.35,t:"調律機がこちらのステータスを規定値へ戻そうとしてくる。"},{n:"誤差修正",m:1.3,t:"機構が判断した。この世界に、この個体は不要だと。"}]},
"終焉の門兵":{in:"終焉門の前に、鎧だけの門兵が立っている。中身は最初から入っていない。",
mv:["門兵が槍を構え、機械的な正確さで突いてくる！", "門兵が盾ごと押し込んでくる！", "門兵が槍を回し、間合いの全てを薙ぎ払った！"],
dead:"門兵の鎧が崩れ落ちた。やはり、中には何も入っていなかった。",
sp:[{n:"門は開かず",m:1.3,t:"門兵が門の前へ戻り、通さないという意思だけを叩きつけてくる。"},{n:"無人の一撃",m:1.25,t:"中身のない鎧が、あり得ない速度で振り抜かれた。"}]},
"無色の天使":{in:"色を持たない翼が広がり、顔のない何かが降りてくる。祝福でも敵意でもない、ただの手続きの気配だ。",
mv:["無色の天使が翼を打ち、光の羽根を撃ち込んでくる！", "天使が音もなく降下し、掌を押し当ててくる！", "天使が両手を組み、こちらのために祈り始めた！"],
dead:"天使は翼を畳み、色のないまま上へ昇っていった。最後まで、顔は見えなかった。",
sp:[{n:"審判",m:1.35,t:"天使がこちらの生涯を読み上げ始めた。判決は既に出ている。"},{n:"無色の福音",m:1.25,t:"意味を持たない言葉が、直接頭の中へ流し込まれる。"}]},
"門の心臓":{in:"終焉門の中心で、脈打つ肉塊が鼓動している。この音が、世界中のゲートの拍動と同じだと気づいてしまった。",
mv:["門の心臓が鼓動し、衝撃波が同心円に広がる！", "心臓から伸びた血管が、槍のように突き出してきた！", "鼓動の間隔が短くなり、圧が連続で押し寄せる！"],
dead:"門の心臓は最後に一度だけ大きく脈打ち、静止した。世界のどこかで、いくつかのゲートが同時に閉じた気配がする。",
sp:[{n:"全ゲート同期",m:1.35,t:"世界中のゲートが同時に脈打った。その分の圧が、ここへ集まってくる。"},{n:"逆流",m:1.3,t:"心臓が一度大きく縮み、溜め込んだ全てを吐き出そうとしている。"}]},
"SSS級門番・はじまりの終わり":{in:"終焉門の向こう側に、最初の一体がいた。全てのゲートはこれの呼吸であり、全ての異界獣はこれの記憶だった。",
mv:["はじまりの終わりが手を伸ばす。その動作だけで空間が裂けた！", "存在そのものが近づいてくる。距離という概念が意味を失う！", "終わりが静かに触れてきた。それだけで、輪郭が削れていく！"],
low:"はじまりの終わりが、初めてこちらを個体として見た。名前を、知られた気がする。",
dead:"それは終わり方を知らないまま終わった。割れていた空が、少しだけ塞がる音がした。",
sp:[{n:"最初の記憶",m:1.4,t:"空が最初に割れた日の光景が、そのまま叩きつけられる。"},{n:"終わりの呼吸",m:1.35,t:"それが息を吸った。世界中のゲートが、同時に細くなる。"}]},
"デイリーボス「蝕む黒影」":{in:"その日ごとに形を変える黒い影が、今日の姿でこちらを待っていた。",
mv:["黒影が形を変えながら殴りかかってくる！", "黒影が地面を這い、足元から立ち上がる！", "黒影が昨日と違う攻撃を仕掛けてきた！"],
low:"黒影の輪郭が定まらなくなってきた。今日の形を、保てなくなっている。",
dead:"黒影は今日の分だけ薄れ、明日また別の形で来ると告げるように消えた。",
sp:[{n:"日替わりの牙",m:1.3,t:"黒影が今日の形を決めた。昨日とは違う殺し方をするつもりだ。"},{n:"蝕み",m:1.25,t:"触れた箇所から、色が抜けていく。"}]},
"ワールドボス「門ノ心臓」":{in:"世界中の覚醒者が同時に挑んでいる巨大な心臓が、ここにも一つの姿を現した。どこかで誰かが与えた傷が、すでに刻まれている。",
mv:["門ノ心臓が鼓動し、全方位へ圧を吐き出す！", "血管が束になって振り下ろされる！", "心臓が収縮し、周囲のものを引き寄せ始めた！"],
low:"心臓の鼓動が乱れ始めた。世界のどこかで、誰かの一撃が効いている。",
dead:"門ノ心臓は動きを止めた。この一体は、大勢の覚醒者が削り切ったものだ。",
sp:[{n:"世界同時脈動",m:1.35,t:"世界中の挑戦者が受けているのと同じ衝撃が、ここにも届く。"},{n:"貢献者狩り",m:1.3,t:"心臓が、傷を与えた者を優先して探し始めた。"}]},
"__rival":{in:"{enemy}が構えを取る。同じ覚醒者の気配――こちらの異能を、正面から潰しに来ている。",
mv:["{enemy}が踏み込みの速さでこちらを上回ってくる！", "{enemy}は異能を温存したまま、体術で削りにきた！", "{enemy}がフェイントを挟み、本命を通してきた！"],
low:"{enemy}が血を吐きながらも笑った。まだ、異能を手放す気はないらしい。",
dead:"{enemy}は仰向けに倒れ、こちらを見上げたまま異能の光を手放した。奪う準備が、整った。",
sp:[{n:"異能全開",m:1.35,t:"{enemy}の周囲で、異能の気配が一気に膨れ上がった。"},{n:"覚醒者の一手",m:1.3,t:"{enemy}が息を止めた。ここで決めるつもりだ。"}]},
"__arena":{in:"{enemy}のデータが読み込まれ、記録された戦い方がそのまま立ち上がる。",
mv:["{enemy}の記録が、定石通りの攻めを再現してくる！", "{enemy}が過去の勝ちパターンをなぞって踏み込んできた！", "{enemy}の動きが一段速くなった！"],
dead:"{enemy}の記録が停止した。アリーナの順位表が、静かに書き換わる。",
sp:[{n:"戦績再現",m:1.3,t:"{enemy}が最も勝率の高い型を選択した。"},{n:"ランキング圧",m:1.25,t:"{enemy}の戦力値が、こちらを上から押し潰しにくる。"}]},

"歪んだ狛犬":{in:"参道の脇に据えられた狛犬が、関節のない身体で首だけをこちらへ回した。",
mv:["狛犬が石畳を砕きながら跳びかかる！", "狛犬が体当たりで距離を潰しにくる！", "狛犬が牙を剥き、真正面から噛みつく！"],
dead:"狛犬は元の石に戻り、台座の上で二つに割れた。",
sp:[{n:"阿吽崩し",m:1.3,t:"狛犬の口が、あってはならない形に開いていく。"},{n:"石化の唸り",m:1.2,t:"狛犬の唸りに合わせ、足元の石が這い上がってくる。"}]},
"注連縄の影":{in:"切れた注連縄が宙に浮き、人の背丈ほどの影を編み上げていく。",
mv:["注連縄の影が縄を伸ばし、手足を絡め取ろうとする！", "影が縄を鞭のように振り抜いた！", "影が輪を作り、こちらの首の高さへ投げてくる！"],
dead:"影を編んでいた縄がほどけ、ただの古い縄になって地面へ落ちた。",
sp:[{n:"禁足の縄",m:1.25,t:"縄が円を描いて地面へ落ちた。この中からは出られない。"},{n:"紙垂裂き",m:1.3,t:"縄に下がった紙垂が刃物のように硬化した。"}]},
"神域の番鳥":{in:"折れた鳥居の上に、目を持たない白い鳥が止まっている。こちらの位置は正確に把握されている。",
mv:["番鳥が滑空し、鉤爪で肩を狙ってきた！", "番鳥が羽ばたき、風圧で押し返してくる！", "番鳥が真上から急降下してくる！"],
dead:"番鳥は最後にもう一度だけ鳴き、羽を一枚残して光へ溶けた。",
sp:[{n:"神鳴きの声",m:1.25,t:"番鳥が鳴いた。人の耳が受け取ってはいけない高さの音だ。"},{n:"羽衣断ち",m:1.3,t:"翼の縁が白く光り、刃の形に整っていく。"}]},
"B級門番・折れた神鏡":{in:"社殿の奥に、真ん中から折れた鏡が浮いている。割れ目のこちら側に、自分の姿が映っていない。",
mv:["神鏡が割れた面を向け、光を撃ち込んでくる！", "神鏡の破片が周囲を旋回し、順番に飛んでくる！", "神鏡が回転し、映した動きをそのまま返してきた！"],
low:"神鏡の割れ目が広がり、映していたものが零れ始めた。",
dead:"神鏡は完全に砕け、破片の一枚一枚に別々の景色を映しながら落ちていった。",
sp:[{n:"映し返し",m:1.35,t:"鏡がこちらの動作を先に映した。まだやっていない動きだ。"},{n:"神罰の写し",m:1.25,t:"鏡の中で、こちらが倒れる場面が再生されている。"}]},
"塔の騎士像":{in:"塔の壁龕から、白い石の騎士が音を立てて降りてきた。剣は最初から抜かれている。",
mv:["騎士像が正確な足運びで間合いを詰め、斬りかかる！", "騎士像が盾で押し込み、体勢を崩しにくる！", "騎士像が剣を横薙ぎに振り抜いた！"],
dead:"騎士像は膝をつき、剣を杖のようにしたまま石に戻った。",
sp:[{n:"白夜の型",m:1.3,t:"騎士像の構えが変わった。教本通りの、最も殺しやすい型だ。"},{n:"石斬撃",m:1.25,t:"剣身に石の重さが乗り、風を割る音が低くなる。"}]},
"白夜の霊蝶":{in:"沈まない太陽の光の中を、掌ほどの白い蝶が群れて漂っている。綺麗だが、近づくと肌が痺れる。",
mv:["霊蝶の群れが視界を覆い、鱗粉を落としてくる！", "霊蝶が一斉に方向を変え、突っ込んできた！", "霊蝶が渦を作り、内側へ引き込もうとする！"],
dead:"霊蝶は一匹ずつ光に溶け、最後の一匹が肩に止まってから消えた。",
sp:[{n:"白夜鱗粉",m:1.2,t:"鱗粉が光を反射し、まぶたを閉じても白い。"},{n:"眠らぬ群舞",m:1.25,t:"蝶の羽ばたきが揃った。眠気と痛みが同時に来る。"}]},
"天蓋の眼":{in:"塔の天井全体が瞬きをした。天蓋そのものが、ひとつの巨大な眼だった。",
mv:["天蓋の眼が視線を走らせ、床ごと焼いてくる！", "眼が細まり、こちらの動きを追い続ける！", "視線の焦点が絞られ、熱が集まってきた！"],
dead:"天蓋の眼はゆっくりと閉じ、二度と開かなかった。塔に、初めて夜が来る。",
sp:[{n:"凝視",m:1.3,t:"眼がこちらだけを見た。見られている箇所が熱を持つ。"},{n:"瞬き",m:1.2,t:"眼が閉じた。開いた時には、もう距離を詰められている。"}]},
"A級門番・白夜の王":{in:"塔の最上階、沈まない陽を背にして王が座っている。立ち上がる動作ひとつに、この階層全体の光が従った。",
mv:["白夜の王が歩を進める。それだけで空気が押し寄せる！", "王が手を払い、光の刃が走った！", "王が静かに間合いを詰め、確実な位置から斬りかかる！"],
low:"王の背後の陽が傾き始めた。この階層に、初めて影が生まれる。",
dead:"王は玉座に戻り、静かに目を閉じた。塔の光が落ち、ようやく夜が訪れる。",
sp:[{n:"永い昼",m:1.35,t:"王が空を指した。夜の来ない時間が、こちらの体力だけを削っていく。"},{n:"王笏の一閃",m:1.3,t:"王が笏を掲げる。これは処刑の作法だ。"}]},
"墓標の剣":{in:"地面に突き立った無数の剣のうち、一本が自ら抜けて宙に浮いた。誰かの墓標だったものだ。",
mv:["墓標の剣が独りでに走り、突き込んでくる！", "剣が回転しながら、斬撃の雨を降らせる！", "剣が地面すれすれを滑り、足を狙ってきた！"],
dead:"剣は再び地面へ突き刺さり、元の墓標に戻って動かなくなった。",
sp:[{n:"埋葬",m:1.3,t:"周囲の墓標が一斉に抜け、こちらを囲むように並んだ。"},{n:"遺志の重み",m:1.25,t:"剣に持ち主の執念が乗り、刃が黒く沈む。"}]},
"眠る覚醒残響":{in:"倒れたまま眠っている覚醒者の輪郭が、光の残像として起き上がった。本人はもういない。",
mv:["残響が生前の型で踏み込んでくる！", "残響が異能を使おうとして、途中で形を崩しながら殴りかかる！", "残響が同じ攻撃を、記憶の通りに繰り返す！"],
dead:"残響は満足したように形を解き、眠っていた本人の上へ静かに降りて消えた。",
sp:[{n:"最期の一手",m:1.35,t:"残響が、死ぬ直前に使った技をもう一度なぞり始めた。"},{n:"未練",m:1.2,t:"残響がこちらの名を呼んだ。知らない声だった。"}]},
"碑文の獣":{in:"墓所の壁一面の碑文から文字が剥がれ落ち、四足の獣の形に組み上がっていく。",
mv:["碑文の獣が文字を撒き散らしながら突進する！", "獣の身体から文字列が伸び、絡みついてくる！", "獣が咆哮し、刻まれた名前を読み上げながら迫る！"],
dead:"獣を構成していた文字がほどけ、それぞれ元の碑文の位置へ戻っていった。",
sp:[{n:"名の重さ",m:1.3,t:"獣が読み上げた名前の数だけ、圧が増していく。"},{n:"刻印噛み",m:1.25,t:"獣の牙の一本一本に、別々の名が刻まれている。"}]},
"S級門番・忘れられた英雄":{in:"墓所の最奥、誰にも名を覚えられていない英雄が、錆びた武器を担いで立っている。こちらを見る目に、恨みはない。",
mv:["英雄が無駄のない歩法で間合いを潰し、斬りかかる！", "英雄が武器を担ぎ直し、体重ごと振り下ろした！", "英雄が半身になり、最短距離で突き込んでくる！"],
low:"英雄が笑った。久しぶりに、本気を出せる相手に会えたという顔だった。",
dead:"英雄は武器を地面に突き立て、ようやく座り込んだ。名を尋ねたが、もう答えは返ってこなかった。",
sp:[{n:"名も無き型",m:1.35,t:"英雄の構えが変わった。どの流派にも残っていない、消えた型だ。"},{n:"忘却の一撃",m:1.3,t:"この一撃を受けた者は、誰も生きて語らなかった。"}]},

"灰狼型異界獣":{in:"灰色の毛皮をした獣が、瓦礫の隙間から低い唸りだけを先に寄越した。",
mv:["灰狼が地を蹴り、喉元めがけて跳ぶ！", "灰狼は身を低くしたまま、横から回り込んできた！", "灰狼が前脚を振り下ろす。爪が空気を裂いた！"],
dead:"灰狼は一声だけ短く鳴き、灰になって崩れた。毛皮のあった場所に、光の粒だけが残る。",
sp:[{n:"喉笛狩り",m:1.25,t:"灰狼の眼が急に静かになった。狩りの手順に入っている。"},{n:"群れの記憶",m:1.2,t:"いない筈の仲間の唸り声が、四方から重なって聞こえる。"}]},
"浮遊影":{in:"人の形をした影が、地面から数センチ浮いたまま滑ってくる。",
mv:["浮遊影が滑るように距離を詰め、腕を伸ばした！", "浮遊影が音もなく背後へ回り込む！", "浮遊影の輪郭が伸び、鞭のようにしなった！"],
dead:"浮遊影は輪郭を保てなくなり、地面のしみに戻って消えた。",
sp:[{n:"沈み込み",m:1.2,t:"浮遊影が床へ溶け、足元の影と混ざり合う。"},{n:"形なき掌",m:1.15,t:"影の腕が関節を無視した角度で曲がった。"}]},
"ゲート虫":{in:"甲殻に亀裂の模様を持つ虫が、羽音を立てて群れごと降りてきた。",
mv:["ゲート虫の群れが、面になって突っ込んでくる！", "ゲート虫が一匹だけ加速し、顔面を狙った！", "ゲート虫の羽音が急に大きくなる。数が増えている！"],
dead:"ゲート虫は殻ごと乾き、風に混ざって砂のように散った。",
sp:[{n:"亀裂噴射",m:1.1,t:"虫の甲殻の亀裂から、異界の粘液が噴き出した。"},{n:"集合体",m:1.25,t:"散っていた虫が一点へ集まり、拳ほどの塊になる。"}]},
"F級門番・灰狼王":{in:"瓦礫の頂で、通常個体の三倍はある灰狼が立ち上がった。周囲の霧が、王の呼吸に合わせて動いている。",
mv:["灰狼王が咆哮と共に突進する！", "灰狼王が前脚で瓦礫ごと薙ぎ払った！", "灰狼王は距離を測り、確実に届く間合いへ詰めてきた！"],
low:"灰狼王の毛皮が半分焼け落ちた。それでも、王は退く姿勢を見せない。",
dead:"灰狼王は膝を折り、最後に一度だけこちらを見た。敵意ではなく、確認するような目だった。",
sp:[{n:"王の顎",m:1.3,t:"灰狼王の顎が外れるほど大きく開く。丸ごと噛み砕くつもりだ。"},{n:"統率咆哮",m:1.25,t:"灰狼王が吼え、死んだはずの群れの気配まで立ち上がる。"}]},
"雨濡れの獣影":{in:"交差点の雨の中、濡れた獣の形をした影がゆっくりと立ち上がった。",

function makeLegendPiece(setId,pi){var set=LEGEND_SETS[setId],p=set.pieces[pi];
return{id:Date.now()+Math.random(),name:p.name,type:p.type,typeLabel:TYPE_LABEL[p.type],rarity:6,rank:'EX',locked:true,
setId:setId,pieceIndex:pi,reqLv:set.reqLv,atk:p.atk||0,def:p.def||0,hp:p.hp||0,crit:p.crit||0,dodge:p.dodge||0};}
function ownsPiece(setId,pi){var found=false;
state.inventory.forEach(function(x){if(x.setId===setId&&x.pieceIndex===pi)found=true;});
state.equipment.forEach(function(x){if(x&&x.setId===setId&&x.pieceIndex===pi)found=true;});
return found;}
function addFrags(setId,n){state.frags=state.frags||{};state.frags[setId]=(state.frags[setId]||0)+n;}
function fragCount(setId){return (state.frags&&state.frags[setId])||0;}
function exchangeFrag(setId,pi){
if(fragCount(setId)<FRAG.cost){showMessage(FRAG.name+'が足りない','交換には '+FRAG.cost+'個 必要。<br>所持 '+fragCount(setId)+'個。');return;}
if(ownsPiece(setId,pi)){showMessage('交換不可','その部位はすでに所持している。');return;}
state.frags[setId]-=FRAG.cost;var it=makeLegendPiece(setId,pi);addItem(it,true);renderAll();
showMessage('交換成立','「'+it.name+'」を手に入れた。<br><br>要求 Lv'+it.reqLv);}
function equippedSetCount(setId){var n=0;state.equipment.forEach(function(it){if(it&&it.setId===setId)n++;});return n;}
function activeSetBonus(){var out=null;
for(var k in LEGEND_SETS){var n=equippedSetCount(k);
if(n>=3){out={setId:k,n:3,b:LEGEND_SETS[k].bonus3};break;}
if(n>=2&&!out)out={setId:k,n:2,b:LEGEND_SETS[k].bonus2};}
return out;}

if(r<0.70+q*0.24)return 5;
if(r<2.8+q*0.70)return 4;

state.secondAbility=id;state.absorbed.push(id);state.phase='second';state.level=1;state.exp=0;state.pendingSkills=[];state.currentGateIndex=6;state.auto=false;stopAuto();
delete tierCache.integrated;updateRank();state.hp=getStats().hp;syncPending();
showMessage('異能吸収',RIVAL_NAMES[id]+'の異能「'+abilityName(id)+'」を吸収した。<br><br>'+(abilityPlus(id)>0?'再習得により、この異能の効果が累計＋'+(abilityPlus(id)*5)+'%強化された。<br><br>':'')+'異能録に記憶が記録された。<br>これより、お前はダブル異能者として戦う。<br><br>リソースは「'+A_DATA[id].res+'」に変わり、スキルも全て新しくなる。<br>元の異能はカンスト済み。<br>新しい異能はレベル1から育成される。');renderAll();}
function doIntegration(){if(state.phase!=='second'||state.level<50)return;var a=getAbilityById(state.baseAbility);var b=getAbilityById(state.secondAbility);
state.integratedName=fusedName();state.integratedReading=fusedReading();state.phase='integrated';state.level=1;state.exp=0;state.pendingSkills=[];state.currentGateIndex=7;state.auto=false;stopAuto();
delete tierCache.integrated;updateRank();state.hp=getStats().hp;syncPending();
showMessage('異能統合覚醒','二つの異能が反発し、やがて一つの祈りになる。<br><br>統合異能<strong>「'+state.integratedName+'」</strong>（'+state.integratedReading+'）が覚醒した。<br><br>役割：'+fusedRoleText()+'<br>リソース：'+curData().res+'<br><br>継承したスキルには相方の理が上乗せされ、Lv30とLv50には、この組み合わせでしか出ない統合専用技が現れる。<br>レベル上限は100に上昇した。');renderAll();}
var rbPick=[];
function openReincarnation(){
if(state.phase!=='integrated'||state.level<levelCap()){showMessage('転生できない','統合異能をカンストさせる必要がある。');return;}
var n=carrySlots();
showModal('<h3>転生</h3><div class="story-text">ここまでの全てを畳み、もう一度Lv1から始める。<br><br>異能は新しいものを選び直す。今の異能は失われる。<br>持ち込めるのは、選んだスキル'+n+'個だけだ。</div>'+
'<div class="card" style="margin-top:12px;"><div class="small">引き継ぐもの</div><div>装備・所持品・ゴールド・治癒薬・称号・アリーナPt</div>'+
'<div class="small" style="margin-top:8px;">失うもの</div><div>異能／習得スキル（持ち込み'+n+'個を除く）／ステータス割り振り／ゲート攻略状況</div>'+
'<div class="small" style="margin-top:8px;">転生ボーナス</div><div>基礎ステータス +'+Math.round((state.rebirth+1)*CONFIG.REINCARNATION_BONUS*100)+'% ／ 獲得経験値 ×'+Math.pow(EXP_TUNING.rebirthMult,state.rebirth+1).toFixed(2)+'<br>ただし敵の強さも +'+Math.round((state.rebirth+1)*ENEMY_TUNING.rebirthScale*100)+'%</div></div>'+
'<button class="danger" onclick="openCarrySelect()">スキルを選ぶ</button> <button onclick="closeModal()">やめる</button>');}
function openCarrySelect(){
rbPick=[];renderCarrySelect();}
function renderCarrySelect(){
var n=carrySlots();var all=learnedSkills();
var body=all.map(function(sk,i){var on=rbPick.indexOf(i)>=0;
return '<button class="skill-option'+(on?' selected':'')+'" style="'+(on?'border-color:#8f6bff;background:#2b2340;':'')+'" onclick="toggleCarry('+i+')">'+
'<span class="cat '+sk.cat+'">'+CAT_LABEL[sk.cat]+'</span><strong>'+sk.name+'</strong>'+(on?' <span style="color:#ffd76b;">✓持ち込む</span>':'')+
'<span class="desc">'+sk.desc+'</span></button>';}).join('');
showModal('<h3>持ち込むスキルを選ぶ</h3><p>'+rbPick.length+' / '+n+' 個選択中。<br><span class="small">選ばなかったスキルは二度と戻らない。リソースは新しい異能のものに読み替えられる。</span></p>'+
'<button class="primary" onclick="openAbilitySelect()" '+(rbPick.length===0?'disabled':'')+'>この'+rbPick.length+'個で決定</button> <button onclick="closeModal()">やめる</button>'+
'<div style="margin-top:12px;">'+body+'</div>');}
function toggleCarry(i){var n=carrySlots();var k=rbPick.indexOf(i);
if(k>=0)rbPick.splice(k,1);else{if(rbPick.length>=n)return;rbPick.push(i);}
renderCarrySelect();}
var rebirthAbilityPick=null;
function openAbilitySelect(){rebirthAbilityPick=null;renderRebirthAbilitySelect();}
function renderRebirthAbilitySelect(){var cand=selectableAbilities();
showModal('<h3>新しい第一異能を選ぶ</h3><p class="small">過去に習得した異能を再び選ぶと「異能＋1」となり、その異能効果がさらに5%強化される。<br>第二異能は、Lv50到達後の覚醒クエストで改めて奪う。</p>'+
cand.map(function(a){var repeat=state.abilityAcquired&&state.abilityAcquired[a.id],chosen=rebirthAbilityPick===a.id,art=ABILITY_ART[a.id]||'';
return '<div class="modal-ability-card'+(chosen&&art?' chosen':'')+'" role="button" tabindex="0" aria-pressed="'+(chosen?'true':'false')+'" onclick="pickRebirthAbility(\''+a.id+'\')" onkeydown="modalAbilityKey(event,\'rebirth\',\''+a.id+'\')">'+
(chosen&&art?'<img class="ability-art" src="'+art+'" alt="'+a.name+'を発動する主人公" width="1024" height="1536" decoding="async" onerror="abilityArtError(this)">':'')+
'<div class="ability-card-copy"><strong style="color:'+a.color+'">'+nextAbilityName(a.id)+'</strong><span class="desc">'+a.reading+' / '+a.role+'<br>'+a.desc+'<br>リソース：'+A_DATA[a.id].res+' ／ 継続ダメージ：'+A_DATA[a.id].dot+(repeat?'<br><span style="color:#ffd76b;">再習得ボーナス：異能効果＋5%</span>':'')+'</span>'+
(chosen?'<span class="ability-selected-chip">選択中</span><button class="choice-confirm" onclick="event.stopPropagation();confirmRebirth(\''+a.id+'\')">この異能で転生する</button>':'')+'</div></div>';}).join('')+
'<button onclick="renderCarrySelect()">スキル選択に戻る</button>');}
function pickRebirthAbility(id){if(rebirthAbilityPick===id)return;rebirthAbilityPick=id;renderRebirthAbilitySelect();}
function modalAbilityKey(e,mode,id){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(mode==='awakening')pickAwakeningAbility(id);else pickRebirthAbility(id);}}
function confirmRebirth(newAbility){
var all=learnedSkills();
var carried=rbPick.map(function(i){var src=all[i];var cp={};for(var k in src)cp[k]=src[k];
cp.id='c'+(state.rebirth+1)+'_'+src.id;cp.carried=true;cp.origin=src.name;return cp;});
state.abilityHistory=state.abilityHistory||[];
if(state.baseAbility)state.abilityHistory.push(state.baseAbility);
if(state.secondAbility)state.abilityHistory.push(state.secondAbility);
state.rebirth++;
state.carriedSkills=carried;
state.phase='first';state.baseAbility=newAbility;state.secondAbility=null;state.integratedName=null;
acquireAbility(newAbility);
state.level=1;state.exp=0;state.statPoints=0;state.alloc={str:0,vit:0,def:0,agi:0,pow:0};
state.learned={first:[],second:[],integrated:[]};state.skillDone={first:[],second:[],integrated:[]};
state.pendingSkills=[];state.gateProgress={};state.currentGateIndex=0;state.absorbed=[];
state.storyNotices=[0];
state.auto=false;stopAuto();state.battle=null;
tierCache={};updateRank();syncEquipLevel();state.hp=getStats().hp;state.hpTs=serverTime();syncPending();
closeModal();renderAll();
var ab=getAbilityById(newAbility);
showModal('<h3>転生</h3><div class="story-text">世界が一度暗くなり、次に目を開けた時、'+state.name+'の魂には別の異能が根を張っていた。<br><br>新しい異能「'+ab.name+'」。<br>リソースは「'+A_DATA[newAbility].res+'」へ変わった。<br><br>持ち込んだ'+carried.length+'個の技だけが、前の生の記憶として残っている。</div>'+
'<p class="small">'+abilityName(newAbility)+'／異能強化＋'+(abilityPlus(newAbility)*5)+'%<br>転生'+state.rebirth+'回目／基礎+'+Math.round(state.rebirth*CONFIG.REINCARNATION_BONUS*100)+'%／経験値×'+Math.pow(EXP_TUNING.rebirthMult,state.rebirth).toFixed(2)+'／敵+'+Math.round(state.rebirth*ENEMY_TUNING.rebirthScale*100)+'%<br>装備は持ち越したが、要求レベルを満たすまで使えない。</p>'+
'<button class="primary" onclick="closeModal()">始める</button>');
processPendingSkills();}
var passWasOn=false;
setInterval(function(){if(state){regenHp();regenStamina();
var on=hasPass();
if(passWasOn&&!on){passWasOn=false;syncEquipSlots(state);state.stamina=Math.min(state.stamina,staminaMax());
if(state.auto){startAuto();}renderAll();showMessage('覚醒者パス終了','パスの期限が切れました。特典は無効になり、装備枠からはみ出した装備は所持品へ戻しています。');}
else passWasOn=on;
safe(renderHeader);if(currentTab==='daily')safe(renderDaily);if(currentTab==='shop')safe(renderShop);}},5000);
mergeFlavor();
renderStart();
installArtPreviewEntry();
cloudInit().then(function(){renderStartContinue();if(state){scheduleCloudSave();fetchPvpProfiles(false);fetchPvpHistory(false);fetchPvpDailyStatus(false);}});
</script>
</body>
</html>
